name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path src\AutoAssignDriveLetters.ps1 -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      - name: Build exe
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          .\build.ps1

      - name: Smoke test
        shell: powershell
        run: |
          $v = & powershell -NoProfile -ExecutionPolicy Bypass -File src\AutoAssignDriveLetters.ps1 -Version
          Write-Host "Script version: $v"
          & powershell -NoProfile -ExecutionPolicy Bypass -File src\AutoAssignDriveLetters.ps1 -List
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: AutoAssignDriveLetters
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
